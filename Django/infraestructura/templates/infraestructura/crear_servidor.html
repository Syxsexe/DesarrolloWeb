{% extends 'infraestructura/base.html' %}

{% block title %}Nuevo Servidor{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0">Registrar Nuevo Nodo de Servidor</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_table }}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'home_servidores' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Servidor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
