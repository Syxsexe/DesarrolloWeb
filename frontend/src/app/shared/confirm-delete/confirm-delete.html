<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 text-center p-4">
      <div class="card-body">
        <h3 class="text-danger mb-3">{{ titulo() }}</h3>
        <p class="text-muted">{{ mensaje() }}</p>
        @if (error()) {
          <div class="alert alert-danger">{{ error() }}</div>
        }
        <div class="mt-4">
          <button type="button" class="btn btn-secondary me-2" (click)="cancel.emit()">Cancelar</button>
          <button type="button" class="btn btn-danger" [disabled]="enviando()" (click)="confirm.emit()">
            @if (enviando()) {
              Eliminando...
            } @else {
              Sí, eliminar
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
